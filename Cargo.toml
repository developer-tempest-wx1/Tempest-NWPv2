[workspace]
resolver = "2"
members = [
    "crates/tempest-core",
    "crates/tempest-cuda",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
authors = ["Tempest NWP Team"]
license = "Apache-2.0"

[workspace.dependencies]
tempest-core = { path = "crates/tempest-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
log = "0.4"
